<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LevelUp API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> LevelUp - Tienda de Videojuegos</h1>

    <div id="formulario">
